<div class="card shadow-sm">
  <div class="card-header bg-success text-white">
    <h1 class="h4 mb-0">Add Trip</h1>
  </div>
  <div class="card-body">
    @if (errorMessage) {
      <div class="alert alert-danger">{{ errorMessage }}</div>
    }
    <form [formGroup]="addForm" (ngSubmit)="onSubmit()" novalidate>
      <div class="row g-3">
        <div class="col-md-4">
          <label for="code" class="form-label">Code</label>
          <input id="code" type="text" class="form-control" formControlName="code" placeholder="e.g. ERNL261101"
                 [class.is-invalid]="submitted && f['code'].errors">
          <div class="invalid-feedback">Trip code is required.</div>
        </div>
        <div class="col-md-8">
          <label for="name" class="form-label">Name</label>
          <input id="name" type="text" class="form-control" formControlName="name"
                 [class.is-invalid]="submitted && f['name'].errors">
          <div class="invalid-feedback">Name is required.</div>
        </div>
        <div class="col-md-4">
          <label for="length" class="form-label">Length</label>
          <input id="length" type="text" class="form-control" formControlName="length" placeholder="e.g. 4 nights / 5 days"
                 [class.is-invalid]="submitted && f['length'].errors">
          <div class="invalid-feedback">Length is required.</div>
        </div>
        <div class="col-md-4">
          <label for="start" class="form-label">Start date</label>
          <input id="start" type="date" class="form-control" formControlName="start"
                 [class.is-invalid]="submitted && f['start'].errors">
          <div class="invalid-feedback">Start date is required.</div>
        </div>
        <div class="col-md-4">
          <label for="perPerson" class="form-label">Price per person</label>
          <input id="perPerson" type="text" class="form-control" formControlName="perPerson" placeholder="e.g. 999.00"
                 [class.is-invalid]="submitted && f['perPerson'].errors">
          <div class="invalid-feedback">Price is required.</div>
        </div>
        <div class="col-md-6">
          <label for="resort" class="form-label">Resort</label>
          <input id="resort" type="text" class="form-control" formControlName="resort"
                 [class.is-invalid]="submitted && f['resort'].errors">
          <div class="invalid-feedback">Resort is required.</div>
        </div>
        <div class="col-md-6">
          <label for="image" class="form-label">Image file name</label>
          <input id="image" type="text" class="form-control" formControlName="image" placeholder="e.g. reef1.jpg"
                 [class.is-invalid]="submitted && f['image'].errors">
          <div class="invalid-feedback">Image is required.</div>
        </div>
        <div class="col-12">
          <label for="description" class="form-label">Description</label>
          <textarea id="description" rows="3" class="form-control" formControlName="description"
                    [class.is-invalid]="submitted && f['description'].errors"></textarea>
          <div class="invalid-feedback">Description is required.</div>
        </div>
      </div>
      <div class="mt-4 d-flex gap-2">
        <button type="submit" class="btn btn-success">Save Trip</button>
        <a routerLink="/" class="btn btn-outline-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
