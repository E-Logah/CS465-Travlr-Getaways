<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white">
        <h1 class="h4 mb-0">Administrator Login</h1>
      </div>
      <div class="card-body">
        @if (formError) {
          <div class="alert alert-danger">{{ formError }}</div>
        }
        <form [formGroup]="loginForm" (ngSubmit)="onLoginSubmit()" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input id="email" type="email" class="form-control" formControlName="email" autocomplete="username"
                   [class.is-invalid]="submitted && f['email'].errors">
          </div>
          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input id="password" type="password" class="form-control" formControlName="password"
                   autocomplete="current-password" [class.is-invalid]="submitted && f['password'].errors">
          </div>
          <button type="submit" class="btn btn-primary w-100">Sign In</button>
        </form>
      </div>
    </div>
  </div>
</div>
