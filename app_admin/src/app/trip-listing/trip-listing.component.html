<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3 mb-0">Trips</h1>
  @if (isLoggedIn()) {
    <button type="button" class="btn btn-success" (click)="addTrip()" [disabled]="usingMockData">+ Add Trip</button>
  } @else {
    <span class="text-muted small">Log in to add, edit, or delete trips.</span>
  }
</div>

@if (message) {
  <div class="alert" [class.alert-info]="!usingMockData" [class.alert-warning]="usingMockData">{{ message }}</div>
}

<div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
  @for (trip of trips; track trip.code) {
    <div class="col">
      <app-trip-card [trip]="trip" (tripDeleted)="onTripDeleted($event)"></app-trip-card>
    </div>
  }
</div>
